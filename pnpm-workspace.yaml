packages:
  - '.'

# https://pnpm.io/supply-chain-security
# Disable package lifecycle scripts (postinstall, etc.) on install.
ignoreScripts: true
# Five days in minutes (5 × 24 × 60).
minimumReleaseAge: 7200
# Fail install if a package's provenance evidence is weaker than evidence seen for
# an earlier release of that same package (e.g. lost trusted publisher).
trustPolicy: no-downgrade
# Exemptions for entries that cannot resolve to an attested version: each is a
# transitive dep whose parent range can't reach one. Pinned to exact versions so
# any new version has to be re-reviewed. Re-audit as these trees move.
trustPolicyExclude:
  - 'chokidar@4.0.3' # sass wants ^4; 4.0.3 is last 4.x (3.6.0 was attested)
  - 'react-redux@8.1.3 || 9.2.0' # query-builder wants ^8 (8.1.2 attested); dnd wants ^9
  - 'semver@6.3.1' # eslint-plugin-react wants ^6; 6.3.1 is last 6.x
  - 'ua-parser-js@1.0.41' # @grafana/faro-web-sdk pins this exact version
# Transitive deps must come from the registry/workspace; block git/tarball URLs except on direct deps.
blockExoticSubdeps: true
# Requires every dependency with a lifecycle script to be listed in allowBuilds
strictDepBuilds: true

allowBuilds:
  core-js: false
  '@parcel/watcher': true
  '@rspack/core': true
  '@swc/core': true
  esbuild: true
  protobufjs: true
  unrs-resolver: true

overrides:
  react-router: ^8.3.0
  # @grafana/scenes wants react-router-dom@^6, whose 6.x line ends at 6.30.4 and is
  # covered by GHSA-jjmj-jmhj-qwj2 (no 6.30.5 was ever published). v7 is a thin
  # `export * from 'react-router'` shim, so scenes still gets Routes/Route while the
  # whole tree shares one router core. @grafana/ui pins RRD 5.3.4 exactly, so its
  # intentional v5 + v5-compat pairing is unaffected by this range override.
  react-router-dom@^6: ^7.18.1
  dompurify: ^3.4.12
  lodash: ^4.18.0
  minimatch@^3: ~3.1.4
  minimatch@^9: ~10.2.0
  minimatch@^10: ^10.2.3
  serialize-javascript: ^7.0.5
  immutable: ^5.1.8
  flatted: ^3.4.0
  undici: ^7.24.0
  picomatch@^2: ~4.0.0
  picomatch@^4: ^4.0.4
  protobufjs@^7: ^8.0.0
  protobufjs@^8: ^8.6.6
  protocol-buffers-schema: ^3.6.1
  '@opentelemetry/core': ^2.8.0
  js-yaml: ^4.3.0
  '@babel/core': ^8.0.0
  '@lezer/common': ^1.5.2
  brace-expansion@^1: ^5.0.7
  brace-expansion@^5: ^5.0.9
  yaml: ^2.8.3
  '@grafana/data': ^13.0.0
  '@grafana/i18n': ^13.0.0
  '@grafana/schema': ^13.0.0
  uuid: ^14.0.0
  postcss: ^8.5.18
  fast-uri: ^3.1.5
  ws: ^8.20.1
  js-cookie: ^3.0.7
  qs: ^6.15.2
  react-data-grid: 7.0.0-beta.61
  websocket-driver: '>=0.7.5'
  brace-expansion: ^5.0.9
  webpack-dev-server: '>=5.2.6'
  ip-address: '>=10.3.1'
  # GHSA-2j2x-hqr9-3h42: open redirect via protocol-relative URL. Transitive via
  # @grafana/ui > react-router-dom-v5-compat. Patched in 1.23.3.
  '@remix-run/router': ^1.23.3
  nanoid: '>=3.3.18'
