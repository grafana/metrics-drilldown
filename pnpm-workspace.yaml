packages:
  - '.'

# https://pnpm.io/supply-chain-security
# Same as passing --frozen-lockfile on every pnpm install (CI uses this via plugin-ci-workflows too).
frozenLockfile: true
# Disable package lifecycle scripts (postinstall, etc.) on install.
ignoreScripts: true
# Five days in minutes (5 × 24 × 60).
minimumReleaseAge: 7200
# Fail install if a package's provenance evidence is weaker than evidence seen for
# an earlier release of that same package (e.g. lost trusted publisher).
trustPolicy: no-downgrade
# Exemptions for entries that cannot resolve to an attested version: each is a
# transitive dep whose parent range can't reach one. Pinned to exact versions so
# any new version has to be re-reviewed. Re-audit as these trees move.
trustPolicyExclude:
  - 'chokidar@4.0.3' # sass wants ^4; 4.0.3 is last 4.x (3.6.0 was attested)
  - 'react-redux@8.1.3 || 9.2.0' # query-builder wants ^8 (8.1.2 attested); dnd wants ^9
  - 'semver@6.3.1' # eslint-plugin-react wants ^6; 6.3.1 is last 6.x
  - 'ua-parser-js@1.0.41' # @grafana/faro-web-sdk pins this exact version
# Transitive deps must come from the registry/workspace; block git/tarball URLs except on direct deps.
blockExoticSubdeps: true
# Requires every dependency with a lifecycle script to be listed in allowBuilds
strictDepBuilds: true

allowBuilds:
  core-js: false
  '@parcel/watcher': true
  '@rspack/core': true
  '@swc/core': true
  protobufjs: true
  unrs-resolver: true

# react-router-dom stays on v6 in package.json until Grafana's upstream router
# migration lands: https://github.com/grafana/grafana/issues/129933
# @grafana/ui's v5 compatibility package pins react-router 6.30.3, so keep that
# transitive v6 line on 6.30.6, which includes the GHSA-jjmj-jmhj-qwj2 backport.
overrides:
  react-router@^6: ^6.30.6
  '@remix-run/router': ^1.23.3
  dompurify: ^3.4.16
  moment: ^2.31.0
  'engine.io@^6': ^6.6.10
  js-cookie: ^3.0.7
  uuid: ^14.0.0
  protobufjs: ^8.6.6
  '@opentelemetry/core': ^2.8.0
  # @grafana/assistant wants a newer @grafana/* line than package.json; without these
  # pnpm installs a second copy of @grafana/data and friends alongside the direct one.
  '@grafana/data': ^13.0.0
  '@grafana/i18n': ^13.0.0
  '@grafana/schema': ^13.0.0
  basic-ftp: '^6.2.1'
