packages:
  - '.'

# https://pnpm.io/supply-chain-security
# Same as passing --frozen-lockfile on every pnpm install (CI uses this via plugin-ci-workflows too).
frozenLockfile: true
# Disable package lifecycle scripts (postinstall, etc.) on install.
ignoreScripts: true
# Five days in minutes (5 × 24 × 60).
minimumReleaseAge: 7200
# Fail install if a package's trust evidence is weaker than an earlier release (e.g. lost trusted publisher).
trustPolicy: no-downgrade
# Transitive deps must come from the registry/workspace; block git/tarball URLs except on direct deps.
blockExoticSubdeps: true
# Requires every dependency with a lifecycle script to be listed in allowBuilds
strictDepBuilds: true

allowBuilds:
  core-js: false
  '@parcel/watcher': true
  '@rspack/core': true
  '@swc/core': true
  esbuild: true
  protobufjs: true
  unrs-resolver: true

overrides:
  '@remix-run/router': ^1.23.2
  react-router: ^6.30.4
  dompurify: ^3.4.11
  lodash: ^4.18.0
  minimatch@^3: ~3.1.4
  minimatch@^9: ~10.2.0
  minimatch@^10: ^10.2.3
  serialize-javascript: ^7.0.5
  immutable: ^5.1.5
  flatted: ^3.4.0
  undici: ^7.24.0
  picomatch@^2: ~4.0.0
  picomatch@^4: ^4.0.4
  protobufjs@^7: ^7.6.4
  protobufjs@^8: ^8.5.1
  protocol-buffers-schema: ^3.6.1
  '@opentelemetry/core': ^2.8.0
  js-yaml: ^4.2.0
  '@babel/core': ^7.29.1
  '@lezer/common': ^1.5.2
  brace-expansion@^1: ^5.0.0
  brace-expansion@^5: ^5.0.6
  yaml: ^2.8.3
  '@grafana/data': ^13.0.0
  '@grafana/i18n': ^13.0.0
  '@grafana/schema': ^13.0.0
  uuid: ^14.0.0
  postcss: ^8.5.10
  fast-uri: ^3.1.2
  ws: ^8.20.1
  js-cookie: ^3.0.7
  qs: ^6.15.2
  react-data-grid: 7.0.0-beta.56
  websocket-driver: '>=0.7.5'
